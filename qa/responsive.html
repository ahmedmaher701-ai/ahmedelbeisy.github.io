<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Portfolio responsive QA</title><style>body{margin:0;background:#ded9d0;font:14px Arial;color:#222}header{padding:12px;display:flex;gap:12px;align-items:center}button{padding:10px}iframe{display:block;border:1px solid #aaa;margin:0 auto;background:#f2efe9;height:820px;max-width:100%}output{font-size:12px}</style></head><body><header><strong>Responsive QA</strong><button data-width="320">320px</button><button data-width="390">390px</button><button data-width="768">768px</button><button data-width="1024">1024px</button><output>390px</output></header><iframe title="Portfolio preview" width="390" src="../index.html#projects"></iframe><script>document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{document.querySelector('iframe').width=b.dataset.width;document.querySelector('output').textContent=b.dataset.width+'px'}));</script></body></html>
